<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Изменить расход</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>Изменить расход</h1>

    <div class="card">
        <form method="POST" class="form-row">
            <input type="date" name="date" value="{{ expense.date }}" required>

            <select name="category">
                {% for c in categories %}
                <option {% if c == expense.category %}selected{% endif %}>{{ c }}</option>
                {% endfor %}
            </select>

            <input type="number" name="amount" value="{{ expense.amount }}" step="0.01" min="0.01" required>
            <input type="text" name="comment" value="{{ expense.comment }}" placeholder="Комментарий">

            <button type="submit" class="btn">Сохранить</button>
            <a href="/" class="btn btn-danger" style="text-decoration: none;">Отмена</a>
        </form>
    </div>
</div>
</body>
</html>
